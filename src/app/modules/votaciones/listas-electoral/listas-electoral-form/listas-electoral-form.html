<div class="axis-card-content">
  <!-- Encabezado -->
  @if (!esEdicion) {
    <div class="axis-page-header">
      <h2 class="axis-page-title">Nueva lista electoral</h2>
      <p class="axis-page-subtitle">Registre la información de la lista electoral.</p>
    </div>
  } @else {
    <div class="axis-page-header">
      <h2 class="axis-page-title">Editar lista electoral</h2>
      <p class="axis-page-subtitle">Modifique la información de la lista electoral.</p>
    </div>
  }
  @if (cargando()) {
    <div class="axis-table-empty">
      <mat-icon>hourglass_empty</mat-icon>
      <div>Cargando información del candidato...</div>
    </div>
  } @else {
    <form class="axis-form" (ngSubmit)="guardarFormulario()">
      <div class="axis-form-row">
        <div class="axis-form-col axis-form-col-6">
          <div class="axis-form-group">
            <label class="axis-form-label" for="nombreLista">Nombre de la lista</label>
            <input id="nombreLista" type="text" class="axis-form-input"
                   placeholder="Ingrese el nombre de la lista"
                   [(ngModel)]="listaElectoral.nombreLista" name="nombreLista" required>
          </div>
        </div>
        <div class="axis-form-col axis-form-col-3">
          <div class="axis-form-group">
            <label class="axis-form-label" for="siglas">Siglas</label>
            <input id="siglas" type="text" class="axis-form-input"
                   placeholder="Ingrese la sigla de la lista"
                   [(ngModel)]="listaElectoral.siglas" name="siglas" required>
          </div>
        </div>
        <div class="axis-form-col axis-form-col-3">
          <div class="axis-form-group">
            <label class="axis-form-label" for="numeroLista">Nro Lista</label>
            <input id="numeroLista" type="number" class="axis-form-input" placeholder="Ingrese el nro de lista"
                   [(ngModel)]="listaElectoral.numeroLista" name="numeroLista" min="1">
          </div>
        </div>
        <div class="axis-form-col axis-form-col-3">
          <div class="axis-form-group">
            <label class="axis-form-label" for="jurisdiccion">Jurisdiccion</label>
            <select id="jurisdiccion" class="axis-form-select"
                    [(ngModel)]="listaElectoral.jurisdiccion" name="jurisdiccion" required>
              <option [ngValue]="undefined">Seleccione una jurisdiccion</option>
              @for (item of jurisdicciones; track item) {
                <option [ngValue]="item">{{ item }}</option>
              }
            </select>
          </div>
        </div>
      </div>
      <div class="axis-form-actions">
        <button type="button" class="axis-button axis-button-secondary" (click)="cancelarFormulario()">
          <mat-icon>close</mat-icon> Cancelar
        </button>
        <button type="submit" class="axis-button axis-button-primary">
          <mat-icon>save</mat-icon>{{ esEdicion ? 'Actualizar' : 'Guardar' }}
        </button>
      </div>
    </form>
  }
</div>
